[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "estonia-signal-intelligence"
version = "0.1.0"
description = "Signal Intelligence Platform for Estonia - foundation for collecting publicly available signals that indicate a residential property may require roofing, kitchen, bathroom, or solar services."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Signal Intelligence Platform Team" }]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "playwright>=1.44,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "rapidfuzz>=3.9,<4.0",
    "loguru>=0.7,<1.0",
    "dependency-injector>=4.41,<5.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
    "black>=24.4,<25.0",
    "pre-commit>=3.7,<4.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
sigint = "app.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM", "N", "ANN", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"alembic/**" = ["ANN", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["dependency_injector.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests touching the database or filesystem",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli/*"]
