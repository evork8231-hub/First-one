# Example, illustrative bathroom remodeling rules.

rules:
  - id: bathroom_remodel_mention
    name: "Bathroom remodel lead from building record and public mention"
    description: >
      A registered building record combined with a public mention of
      bathroom work indicates a likely bathroom remodeling need.
    lead_type: bathroom_remodeling
    base_confidence: 0.5
    weight: 1.0
    enabled: true
    conditions:
      - signal_type: building_record
        min_count: 1
      - signal_type: bathroom_mention
        min_count: 1

  - id: bathroom_renovation_listing
    name: "Bathroom remodel lead from renovation mention and real estate listing"
    description: >
      A real estate listing combined with a separate renovation mention
      corroborates an intent to remodel the bathroom.
    lead_type: bathroom_remodeling
    base_confidence: 0.45
    weight: 0.8
    enabled: true
    conditions:
      - signal_type: real_estate_listing
        min_count: 1
      - signal_type: renovation_mention
        min_count: 1
