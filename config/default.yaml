# Default structured configuration for the Signal Intelligence Platform.
#
# Values here can be overridden per-deployment by environment variables
# prefixed SIGINT_ (e.g. SIGINT_DATABASE__URL, SIGINT_LOGGING__LEVEL).
# Environment variables always take precedence over this file -- see
# app/config/loader.py and docs/CONFIGURATION.md.
#
# Secrets (API keys, credentials) must NEVER be added to this file --
# they are read exclusively from environment variables.

environment: development
country_code: EE

database:
  url: "sqlite:///./data/signals.db"
  echo: false
  busy_timeout_seconds: 5.0

logging:
  level: INFO
  json_logs: false
  log_file: "logs/app.log"
  rotation: "10 MB"
  retention: "30 days"

retry:
  max_retries: 3
  initial_backoff_seconds: 0.5
  backoff_multiplier: 2.0
  max_backoff_seconds: 30.0
  jitter_seconds: 0.1
  timeout_seconds: 60.0

verification:
  min_signal_confidence: 0.5
  min_lead_confidence: 0.5
  require_coordinates: false
  postal_code_pattern: "^\\d{5}$"
  coordinate_bounds:
    # Estonia's real, publicly known extent (incl. islands).
    min_latitude: 57.5
    max_latitude: 59.7
    min_longitude: 21.5
    max_longitude: 28.2
  duplicate_detection:
    enabled: true
    comparison_scope_limit: 200
    coordinate_duplicate_radius_meters: 25.0
    fuzzy_duplicate_threshold: 95.0
    fuzzy_possible_duplicate_threshold: 80.0
    possible_duplicate_policy: flag

concurrency:
  # Maximum collectors 'sigint collect --all'/'sigint pipeline' run at once.
  max_concurrent_collectors: 3

# No collectors ship enabled by default. Add a collector's name to
# `enabled` only after confirming its site-specific settings below are
# correct for the live source -- several fields (marked below) could not
# be verified against a live source while building this configuration and
# are left unset/best-effort on purpose. See docs/CONFIGURATION.md.
collectors:
  enabled: []

  ehitisregister:
    base_url: "https://andmed.eesti.ee"
    dataset_slug: "ehitisregister"
    timeout_seconds: 30.0
    request_delay_seconds: 1.0
    max_retries: 3
    max_records_per_run: 500
    default_confidence: 0.9
    # Response caching is off by default; the registry API is not known to
    # rate-limit, so caching is a purely optional performance knob.
    cache_enabled: false
    cache_ttl_seconds: 300.0
    # field_map: uses built-in defaults (see app/config/settings.py) --
    # candidate source JSON keys tried in order. Adjust here if the real
    # dataset resource uses different key names.

  # DISABLED BY DESIGN. X-tee is a real, documented alternative access path
  # to Ehitisregister, but it requires a registered X-tee member agreement,
  # a security server, and member certificates that this platform cannot
  # provision -- see docs/COLLECTORS.md#ehitisregister. Every field below
  # is left unset on purpose; do not fill these in unless you have your
  # own confirmed X-tee registration and Ehitisregister service access.
  # Even fully configured, this adapter still refuses to run (see
  # app/collectors/ehitisregister_xtee_collector.py) because the
  # operation-specific request/response schema was never verified.
  ehitisregister_xtee:
    enabled: false
    security_server_url: null
    xroad_instance: null
    member_class: null
    member_code: null
    subsystem_code: null
    client_cert_path: null
    client_key_path: null
    service_member_class: null
    service_member_code: null
    service_subsystem_code: null
    service_code: null
    service_version: null

  ilmateenistus:
    base_url: "https://www.ilmateenistus.ee"
    # REQUIRED before enabling: the exact public forecast XML feed URL
    # documented at ilmateenistus.ee/teenused/ilmainfo/eesti-prognoos-xml/
    # could not be confirmed against a live source in this environment.
    xml_url: null
    timeout_seconds: 30.0
    request_delay_seconds: 1.0
    max_retries: 3
    cache_enabled: false
    cache_ttl_seconds: 300.0
    default_confidence: 0.8
    wind_severity_reference_ms: 25.0
    categorical_event_severity: 0.5
    # place_administrative_areas: uses built-in defaults (major cities only,
    # see app/config/settings.py). Forecast places outside this table are
    # skipped rather than guessed -- extend here as needed.

  kv_ee:
    base_url: "https://www.kv.ee"
    timeout_seconds: 30.0
    request_delay_seconds: 2.0
    max_retries: 3
    headless: true
    max_listings_per_run: 50
    # REQUIRED before enabling: search_paths and listing_link_selector are
    # site-specific and could not be confirmed against the live site in
    # this environment.
    search_paths: []
    listing_link_selector: null

  kinnisvara24:
    base_url: "https://www.kinnisvara24.ee"
    timeout_seconds: 30.0
    request_delay_seconds: 2.0
    max_retries: 3
    headless: true
    max_listings_per_run: 50
    search_paths: []
    listing_link_selector: null

  city24:
    base_url: "https://www.city24.ee"
    timeout_seconds: 30.0
    request_delay_seconds: 2.0
    max_retries: 3
    headless: true
    max_listings_per_run: 50
    search_paths: []
    listing_link_selector: null

rules:
  directory: "config/rules"

scoring:
  confidence_aggregation: mean
  weather_confidence_boost_factor: 0.2
  priority_thresholds:
    critical: 0.85
    high: 0.65
    medium: 0.4
    low: 0.0

# Controls the WEATHER_EVENT Signal built from each collected WeatherEvent
# (see app/application/services/weather_signal_bridge_service.py). Every
# other field on the bridged signal is a direct pass-through of the real
# WeatherEvent -- these two have no WeatherEvent equivalent to copy from.
weather_signal_bridge:
  service_category: roofing
  signal_confidence: 0.8

export:
  default_format: json
  output_directory: "exports"
  excel:
    header_fill_color: "1F4E78"
    header_font_color: "FFFFFF"
    freeze_header_row: true
    enable_autofilter: true
    auto_size_columns: true
    min_column_width: 10
    max_column_width: 60
    date_format: "yyyy-mm-dd hh:mm:ss"
